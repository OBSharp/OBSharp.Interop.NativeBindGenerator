workflow: GitHubFlow/v1
tag-prefix: "[vV]?"
assembly-file-versioning-format: "{Major}.{Minor}.{Patch}.{CommitsSinceVersionSource}"
assembly-informational-format: "{SemVer}+{CommitsSinceVersionSource}"
branches:
  main:
    label: "build"
    increment: Patch
    prevent-increment:
      when-current-commit-tagged: true
  feature:
    regex: ^feat(ures?)?[\/-](?<BranchName>.+)
    label: "{BranchName}"
  pull-request:
    label: pr{Number}
